services:
  jellyfin:
    env_file:
      - path: ./.env
        required: true
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    ports:
      - ${serverport}:8096/tcp
      - ${discoveryport}:7359/udp
    volumes:
      - ${configvolume}:/config
      - ${cachevolume}:/cache
      - type: bind
        source: ${mediavolume}
        target: /media
        read_only: true
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=${publishedurl}
    extra_hosts:
      - 'host.docker.internal:host-gateway'