services:
  jellyfin:
    env_file:
      - path: ./jellyfin.env
        required: true
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    ports:
      - ${server-port}:8096/tcp
      - ${discovery-port}:7359/udp
    volumes:
      - ${config-volume}:/config
      - ${cache-volume}:/cache
      - type: bind
        source: ${media-volume}
        target: /media
        read_only: true
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=${published-url}
    extra_hosts:
      - 'host.docker.internal:host-gateway'